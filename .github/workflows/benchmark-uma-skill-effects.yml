name: Benchmark Uma skill effects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-uma-skill-effects.yml"
      - ".github/scripts/benchmark-uma-effects.mjs"
      - ".github/scripts/umalator-current-gain.ts"
      - "uma-training-lab-data/tools/build-skill-data.mjs"
      - "uma-training-lab-data/tools/bootstrap-utools.mjs"
      - "uma-training-lab-data/tools/utools-live.mjs"

permissions:
  contents: read

concurrency:
  group: uma-skill-effect-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        course: [10501, 10602, 10606, 10506]
        style: [runner, leader, betweener, chaser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh this JP reference page directly from live U-tools
        working-directory: uma-training-lab-data/tools
        run: node bootstrap-utools.mjs --course ${{ matrix.course }} --style ${{ matrix.style }}
      - name: Clone modern Umalator evaluator
        run: git clone --depth 1 https://github.com/kachi-dev/uma-tools.git .cache/uma-tools
      - name: Install evaluator dependencies
        working-directory: .cache/uma-tools/uma-skill-tools
        run: npm ci
      - name: Patch upstream benchmark compatibility
        working-directory: .cache/uma-tools/uma-skill-tools
        run: sed -i "/EnhancedHpPolicy/d" RaceSolverBuilder.ts
      - name: Build current JP skill definitions
        working-directory: uma-training-lab-data/tools
        run: node build-skill-data.mjs --server jp --out "$GITHUB_WORKSPACE/.cache/uma-tools/uma-skill-tools/data/skill_data.json"
      - name: Install current RaceSolverBuilder benchmark adapter
        run: cp .github/scripts/umalator-current-gain.ts .cache/uma-tools/uma-skill-tools/.training-lab-current-gain.ts
      - name: Compare JP Umalator output against live JP U-tools reference values
        shell: bash
        run: |
          case "${{ matrix.style }}" in
            runner) profile=nige ;;
            leader) profile=senkou ;;
            betweener) profile=sasi ;;
            chaser) profile=oikomi ;;
          esac
          node .github/scripts/benchmark-uma-effects.mjs \
            --tools-dir "$GITHUB_WORKSPACE/.cache/uma-tools/uma-skill-tools" \
            --db "$GITHUB_WORKSPACE/uma-training-lab-data/skill-effects/jp/${{ matrix.course }}/${{ matrix.style }}.json" \
            --profile "$profile" \
            --samples 750 \
            --limit 96 \
            --out "$GITHUB_WORKSPACE/uma-effect-benchmark-${{ matrix.course }}-${{ matrix.style }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uma-effect-benchmark-${{ matrix.course }}-${{ matrix.style }}
          path: uma-effect-benchmark-${{ matrix.course }}-${{ matrix.style }}.json
          if-no-files-found: ignore
          retention-days: 7
