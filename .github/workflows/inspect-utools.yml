name: Inspect U-tools RSC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-utools.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect live course payload
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://xn--gck1f423k.xn--1bvt37a.tools/race/courses/10606/effects/leader';
          const res = await fetch(url, {headers:{'user-agent':'Mozilla/5.0'}});
          const html = await res.text();
          console.log('html', html.length, 'expectedEffect raw count', html.split('expectedEffect').length - 1);
          for (const needle of ['expectedEffect','200492','余勢を駆って','セイリオス','medianEffect','averageEffect','activationRate','effectiveness']) {
            const i = html.indexOf(needle);
            console.log('\n===== '+needle+' @ '+i+' =====');
            if (i >= 0) console.log(html.slice(Math.max(0,i-3000), i+7000));
          }
          NODE
