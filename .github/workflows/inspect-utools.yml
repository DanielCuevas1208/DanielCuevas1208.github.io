name: Inspect U-tools RSC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-utools.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect U-tools character reader
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const target='https://xn--gck1f423k.xn--1bvt37a.tools/race/courses/10606/effects';
          const text=await (await fetch('https://r.jina.ai/'+target,{headers:{accept:'text/plain','user-agent':'uma-training-lab-skill-db/1.0'}})).text();
          console.log('chars',text.length);
          console.log(text.slice(0,30000));
          NODE
