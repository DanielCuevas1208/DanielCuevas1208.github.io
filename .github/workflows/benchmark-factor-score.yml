name: Verify factor score

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-factor-score.yml"
      - ".github/scripts/patch-training-lab-factor-exact.mjs"
      - "uma-training-lab-data/tools/utools-factor-score-exact.mjs"
      - "uma-training-lab-data/tools/verify-utools-factor-exact.mjs"
      - "uma-training-lab-data/factor-score/model.json"
      - "uma-training-lab-data/factor-score/exact-pages/**"
      - "uma-training-lab-data/factor-score/rankings/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factor-score-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test exact factor HTML migration
        run: node .github/scripts/patch-training-lab-factor-exact.mjs --self-test

      - name: Verify exact U-tools factor parity
        working-directory: uma-training-lab-data/tools
        run: node verify-utools-factor-exact.mjs

      - name: Inspect U-tools factor page payload
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/inspect-utools-factor-rsc.mjs | tee utools-factor-rsc.txt

      - name: Fit legacy interpretable approximation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/factor-score-benchmark.mjs | tee factor-score-benchmark.txt

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: factor-score-research
          path: |
            factor-score-benchmark.txt
            utools-factor-rsc.txt
