name: Benchmark factor score

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-factor-score.yml"
      - ".github/scripts/factor-score-benchmark.mjs"
      - ".github/scripts/patch-training-lab-factor-v2.mjs"
      - "uma-training-lab-data/skill-effects/jp/11203/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factor-score-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test factor v2 HTML patcher
        run: node .github/scripts/patch-training-lab-factor-v2.mjs --self-test

      - name: Fit interpretable U-tools factor model
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/factor-score-benchmark.mjs | tee factor-score-benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: factor-score-benchmark
          path: factor-score-benchmark.txt
