name: Refresh factor score data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-factor-score.yml"
      - "uma-training-lab-data/tools/build-factor-events.mjs"
      - "uma-training-lab-data/factor-score/model.json"
  workflow_dispatch:
  schedule:
    - cron: "41 11 * * *"

permissions:
  contents: write

concurrency:
  group: factor-score-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build exact support event topology
        working-directory: uma-training-lab-data/tools
        run: node build-factor-events.mjs

      - name: Validate factor-score assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const model=JSON.parse(fs.readFileSync('uma-training-lab-data/factor-score/model.json','utf8'));
          const events=JSON.parse(fs.readFileSync('uma-training-lab-data/factor-score/support-events.json','utf8'));
          if (model.schemaVersion !== 1 || model.modelVersion !== 'utools-copycat-v3') throw new Error('Unexpected factor model schema/version');
          if (!(Number(model.validation?.leaveOneStyleOutSpearman) >= 0.86)) throw new Error('Factor model validation regressed');
          const neo=events.cards?.['30287'] || [];
          if (!neo.some(event => (event.choices || []).some(choice => (choice || []).length >= 2))) {
            throw new Error('Neo Universe 30287 multi-hint event topology is missing');
          }
          console.log(`Validated factor model and ${Object.keys(events.cards || {}).length} support event topologies.`);
          NODE

      - name: Commit refreshed factor data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_if_changed() {
            if [ -z "$(git status --porcelain -- uma-training-lab-data/factor-score)" ]; then
              echo "Factor-score data is already current."
              return 0
            fi
            git add uma-training-lab-data/factor-score
            git commit -m "data: refresh factor-score support events"
            git push
          }

          if publish_if_changed; then
            exit 0
          fi

          echo "Main advanced during factor refresh; regenerating on the latest tree."
          git fetch origin main
          git reset --hard origin/main
          (cd uma-training-lab-data/tools && node build-factor-events.mjs)
          publish_if_changed
