name: Refresh factor score data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-factor-score.yml"
      - "uma-training-lab-data/tools/build-factor-events.mjs"
      - "uma-training-lab-data/tools/utools-factor-live.mjs"
      - "uma-training-lab-data/tools/bootstrap-utools-factor-rankings.mjs"
      - "uma-training-lab-data/tools/bootstrap-utools-factor-inputs.mjs"
      - "uma-training-lab-data/tools/utools-factor-rsc.mjs"
      - "uma-training-lab-data/tools/utools-factor-score-exact.mjs"
      - "uma-training-lab-data/factor-score/model.json"
  workflow_dispatch:
  schedule:
    - cron: "41 11 * * *"

permissions:
  contents: write

concurrency:
  group: factor-score-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test factor ranking parser
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { parseUtoolsFactorReader } from './uma-training-lab-data/tools/utools-factor-live.mjs';
          const deck=Array.from({length:5},(_,i)=>`![Image ${i+1}: [Deck ${i+1}] Card](https://static.kouryaku.tools/umamusume/images/supports/${30000+i}/thumb.png?width=1200)`).join('\n\n');
          const rows=Array.from({length:10},(_,i)=>`![Image ${i+6}: [Rank ${i+1}] Card](https://static.kouryaku.tools/umamusume/images/supports/${30100+i}/full.png?width=828&height=400)\n\n${(50-i/2).toFixed(2)}\n\nLv ${i%5}`).join('\n\n');
          const fixture=`本育成デッキによる減点補正\n\n${deck}\n\n### 不足しているかもしれないスキル\n\n## オススメのサポートカード\n\n${rows}`;
          const parsed=parseUtoolsFactorReader(fixture);
          if(parsed.deck.length!==5 || parsed.rows.length!==10) throw new Error(`fixture parse failed: deck=${parsed.deck.length}, rows=${parsed.rows.length}`);
          if(parsed.rows[0].id!==30100 || parsed.rows[0].name!=='[Rank 1] Card' || parsed.rows[0].score!==50 || parsed.rows[0].level!==0) throw new Error('fixture first row mismatch');
          console.log('Factor ranking parser fixture passed.');
          NODE

      - name: Import exact U-tools factor support inputs
        working-directory: uma-training-lab-data/tools
        run: node bootstrap-utools-factor-inputs.mjs

      - name: Build exact support event topology
        working-directory: uma-training-lab-data/tools
        run: node build-factor-events.mjs

      - name: Import full live U-tools factor rankings
        working-directory: uma-training-lab-data/tools
        run: node bootstrap-utools-factor-rankings.mjs

      - name: Verify exact U-tools factor parity
        working-directory: uma-training-lab-data/tools
        run: node verify-utools-factor-exact.mjs

      - name: Validate factor-score assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const model=JSON.parse(fs.readFileSync('uma-training-lab-data/factor-score/model.json','utf8'));
          const events=JSON.parse(fs.readFileSync('uma-training-lab-data/factor-score/support-events.json','utf8'));
          const exactInputs=JSON.parse(fs.readFileSync('uma-training-lab-data/factor-score/utools-support-cards.json','utf8'));
          const styles=['runner','leader','betweener','chaser'];
          const rankings=Object.fromEntries(styles.map(style=>[
            style,
            JSON.parse(fs.readFileSync(`uma-training-lab-data/factor-score/rankings/chm2/${style}.json`,'utf8')),
          ]));
          if (model.schemaVersion !== 1 || model.modelVersion !== 'utools-copycat-v3') throw new Error('Unexpected factor model schema/version');
          if (!(Number(model.validation?.leaveOneStyleOutSpearman) >= 0.86)) throw new Error('Factor model validation regressed');
          if (!Array.isArray(exactInputs.cards) || exactInputs.cards.length < 100) throw new Error('Exact U-tools support input asset is missing or too small');
          const exactNeo=exactInputs.cards.find(card=>Number(card.id)===30287);
          if (!exactNeo || !Array.isArray(exactNeo.hintSkillIds) || !Array.isArray(exactNeo.randomSkillInfos) || !Array.isArray(exactNeo.sequenceSkillInfos)) {
            throw new Error('Exact U-tools Neo Universe factor inputs are incomplete');
          }
          const neo=events.cards?.['30287'] || [];
          if (!neo.some(event => (event.choices || []).some(choice => (choice || []).length >= 2))) {
            throw new Error('Neo Universe 30287 multi-hint event topology is missing');
          }
          for (const style of styles) {
            const ranking=rankings[style];
            if ((ranking.deck || []).length !== 5) throw new Error(`${style}: expected 5 main-deck supports`);
            if ((ranking.rows || []).length < 20) throw new Error(`${style}: expected at least 20 factor ranking rows`);
            if (!ranking.rows.every((row,index)=>Number(row.rank)===index+1 && Number.isInteger(Number(row.id)) && Number.isFinite(Number(row.score)))) {
              throw new Error(`${style}: malformed factor ranking row`);
            }
          }
          console.log(`Validated factor model, ${exactInputs.cards.length} exact U-tools support inputs, ${Object.keys(events.cards || {}).length} support event topologies, and full rankings: ${styles.map(style=>style+'='+rankings[style].rows.length).join(', ')}.`);
          NODE

      - name: Commit refreshed factor data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_if_changed() {
            if [ -z "$(git status --porcelain -- uma-training-lab-data/factor-score)" ]; then
              echo "Factor-score data is already current."
              return 0
            fi
            git add uma-training-lab-data/factor-score
            git commit -m "data: refresh factor-score support events"
            git push
          }

          if publish_if_changed; then
            exit 0
          fi

          echo "Main advanced during factor refresh; regenerating on the latest tree."
          git fetch origin main
          git reset --hard origin/main
          (cd uma-training-lab-data/tools && node build-factor-events.mjs && node bootstrap-utools-factor-rankings.mjs)
          publish_if_changed
